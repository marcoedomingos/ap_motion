<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120c04"/>
      <stop offset="35%" stop-color="#3d2605"/>
      <stop offset="70%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#f7b731"/>
    </linearGradient>
    <radialGradient id="glowGlow" cx="0.8" cy="0.88" r="0.25">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#ffeaa7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f7b731" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="handGlow" cx="0.5" cy="0.25" r="0.4">
      <stop offset="0%" stop-color="#2d1d07" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)"/>

  <!-- Hands in Solidarity (Artistic Vector Representation) -->
  <g id="hands-silhouette" opacity="0.92">
    <!-- Arm 1 from left -->
    <path d="M 0 0 L 520 180 C 580 200 620 250 630 310 C 640 370 600 420 540 440 L 460 460 C 420 470 380 440 370 400 L 320 220 Z" fill="#2b1a0d"/>
    <path d="M 120 0 L 550 160 C 610 185 645 235 650 290 C 655 350 610 395 550 410 L 480 425 C 440 435 410 410 400 375 L 360 210 Z" fill="#3f2714"/>
    
    <!-- Arm 2 from right clasping wrist -->
    <path d="M 1080 320 L 760 120 C 710 90 640 100 600 145 C 560 190 560 255 600 300 L 720 440 C 760 485 810 590 850 720 C 870 780 910 820 950 830 L 1080 850 Z" fill="#23140a"/>
    <path d="M 1080 240 L 790 90 C 735 60 670 70 630 115 C 590 160 590 220 630 265 L 750 405 C 790 450 835 560 880 690 C 900 740 940 780 980 790 L 1080 810 Z" fill="#351d0e"/>

    <!-- Clasped fingers details -->
    <!-- Finger 1 -->
    <path d="M 610 160 C 650 190 690 230 730 265 C 760 290 770 330 745 355 C 720 380 680 370 650 340 L 580 270 C 560 250 560 210 580 180 Z" fill="#4a2a14" filter="url(#shadow)"/>
    <!-- Finger 2 -->
    <path d="M 570 210 C 610 240 660 285 700 325 C 730 355 735 395 710 420 C 685 440 645 430 615 395 L 540 315 C 520 290 525 250 550 225 Z" fill="#442612" filter="url(#shadow)"/>
    <!-- Finger 3 -->
    <path d="M 530 265 C 570 300 620 345 660 385 C 690 415 695 455 670 480 C 645 500 605 490 575 455 L 500 375 C 480 350 485 310 510 285 Z" fill="#3c200f" filter="url(#shadow)"/>
    <!-- Finger 4 -->
    <path d="M 490 325 C 530 360 575 405 615 445 C 645 475 650 515 625 540 C 600 560 560 550 530 515 L 465 445 C 445 420 450 380 475 355 Z" fill="#341b0c" filter="url(#shadow)"/>
    <!-- Supporting Thumb -->
    <path d="M 400 130 C 440 120 480 140 505 180 C 530 220 520 270 480 290 L 430 310 C 390 320 350 300 335 260 L 320 200 C 310 160 350 140 400 130 Z" fill="#522f18"/>

    <!-- Fingernails realistic accents -->
    <ellipse cx="740" cy="335" rx="14" ry="20" fill="#6e3f22" opacity="0.6" transform="rotate(-35 740 335)"/>
    <ellipse cx="710" cy="395" rx="13" ry="19" fill="#6e3f22" opacity="0.6" transform="rotate(-35 710 395)"/>
    <ellipse cx="670" cy="455" rx="12" ry="18" fill="#6e3f22" opacity="0.6" transform="rotate(-35 670 455)"/>
    <ellipse cx="760" cy="635" rx="14" ry="22" fill="#8c502b" opacity="0.7" transform="rotate(25 760 635)"/>
  </g>

  <!-- Circular Badge: Talento Envolvido (TE) top right -->
  <g transform="translate(890, 260)">
    <circle cx="0" cy="0" r="85" fill="#000000" stroke="#f1c40f" stroke-width="4" filter="url(#shadow)"/>
    <circle cx="0" cy="0" r="75" stroke="#f1c40f" stroke-dasharray="4 4" stroke-width="2" fill="none"/>
    <!-- Laurels -->
    <path d="M -55 35 C -65 0 -55 -40 -30 -60" fill="none" stroke="#f1c40f" stroke-width="3"/>
    <path d="M 55 35 C 65 0 55 -40 30 -60" fill="none" stroke="#f1c40f" stroke-width="3"/>
    <!-- Stars -->
    <text x="0" y="-45" font-family="Arial, sans-serif" font-size="14" fill="#f1c40f" text-anchor="middle">★★★</text>
    <!-- Text TALENTO ENVOLVIDO in curve simulated -->
    <text x="0" y="-28" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="bold" font-size="11" fill="#f1c40f" text-anchor="middle" letter-spacing="1">TALENTO ENVOLVIDO</text>
    <!-- Big Monogram TE -->
    <text x="0" y="24" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="52" fill="#ffffff" text-anchor="middle" letter-spacing="-1">TE</text>
    <line x1="-35" y1="36" x2="35" y2="36" stroke="#f1c40f" stroke-width="2"/>
    <text x="0" y="52" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9" fill="#f1c40f" text-anchor="middle" letter-spacing="3">ACADEMIA</text>
  </g>

  <!-- Typography Center: Antes de cultivar qualquer talento, cultive o talento de Se Amar -->
  <g transform="translate(540, 480)" text-anchor="middle">
    <!-- "Antes de cultivar" -->
    <text x="0" y="0" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="56" fill="#fff4cf" opacity="0.95" filter="url(#shadow)">
      Antes de cultivar
    </text>
    <!-- "qualquer talento," -->
    <text x="0" y="68" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-weight="bold" font-size="58" fill="#fff4cf" opacity="0.98" filter="url(#shadow)">
      qualquer talento,
    </text>
    <!-- "cultive o talento de" -->
    <text x="0" y="136" font-family="'Playfair Display', Georgia, serif" font-style="italic" font-size="52" fill="#fff4cf" opacity="0.95" filter="url(#shadow)">
      cultive o talento de
    </text>
    <!-- "Se Amar" -->
    <text x="0" y="235" font-family="'Plus Jakarta Sans', Impact, sans-serif" font-weight="900" font-size="108" fill="#ffffff" letter-spacing="0.5" filter="url(#shadow)">
      Se Amar
    </text>
  </g>

  <!-- Bottom Brand Block: Setembro Amarelo, Yellow Ribbon, Glowing Heart -->
  <g transform="translate(60, 960)">
    <!-- Setembro -->
    <text x="0" y="110" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="124" fill="#ffffff" letter-spacing="-2" filter="url(#shadow)">
      Setembro
    </text>
    <!-- Amarelo -->
    <text x="0" y="220" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="124" fill="#ffffff" letter-spacing="-2" filter="url(#shadow)">
      Amarelo
    </text>
  </g>

  <!-- Golden 3D Ribbon Loop Center-Right -->
  <g transform="translate(580, 950)">
    <!-- Loop Back -->
    <path d="M 50 140 C 30 70 80 0 140 0 C 190 0 230 50 230 110 C 230 170 170 230 100 280 L 40 330 C 20 345 -10 330 0 310 L 60 220" fill="#d48806" filter="url(#shadow)"/>
    <!-- Loop Front with metallic yellow sheen -->
    <path d="M 60 220 C 130 160 200 110 200 60 C 200 25 170 10 140 10 C 100 10 70 50 80 100 L 130 200 C 160 250 200 310 240 350 C 260 370 270 390 250 395 C 230 400 210 380 180 340 L 110 250 Z" fill="#ffeaa7"/>
    <path d="M 80 100 C 70 50 100 10 140 10 C 170 10 200 25 200 60 C 200 110 130 160 60 220 L 10 300 C 0 320 20 330 40 315 L 110 250 Z" fill="#f1c40f"/>
  </g>

  <!-- Glowing Golden Soft Heart -->
  <g transform="translate(860, 1060)" filter="url(#shadow)">
    <!-- Outer Glow -->
    <circle cx="0" cy="0" r="160" fill="url(#glowGlow)"/>
    <!-- Heart Shape -->
    <path d="M 0 60 C -120 -40 -120 -140 -40 -160 C 0 -160 0 -120 0 -100 C 0 -120 0 -160 40 -160 C 120 -140 120 -40 0 60 Z" fill="#fff9db" opacity="0.95" transform="scale(0.85)"/>
  </g>
</svg>
